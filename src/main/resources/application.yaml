server:
  port: 8084

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
      # Without eager-load, the ServiceInstanceListSupplier for a Feign client is
      # built lazily on first use and starts empty, so the very first call to a
      # peer fails with "Load balancer does not contain an instance".
      eager-load:
        clients: product-service
    # Spring Cloud CircuitBreaker, left on its defaults, hands every call to a worker thread behind a time limiter
    # (1 s, which silently cuts every slower call) and a bulkhead thread pool of one thread per CPU with a
    # 100-call queue (two concurrent calls in a 2-CPU container, the rest rejected). All three are off: the call
    # runs on the calling thread, Feign's connect and read timeouts below govern, and the breaker only counts.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # Fail fast on a peer that vanished mid-rollout (default connect
            # timeout is 10s) so the connection-failure retry in FeignConfig can
            # move on to the next instance; reads stay generous.
            connect-timeout: 2000
            read-timeout: 10000
  application:
    name: order-service
  jackson:
    # A fractional or numeric-string value for an integer field (quantity 1.5, 2.0, "3") is refused
    # instead of being silently coerced (I-2).
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/orderdb}
    username: ${DB_USERNAME:orderuser}
    password: ${DB_PASSWORD:orderpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # A request waits at most 5 s for a pooled connection (then 503), not the 30 s default
      # that queues threads behind a stuck database.
      connection-timeout: 5000
      # pgjdbc defaults to no socket timeout: a database that stops answering (dropped packets, frozen host)
      # would hold the request thread or the Kafka consumer thread until the OS gives up, many minutes later.
      data-source-properties:
        connectTimeout: 5   # seconds
        socketTimeout: 30   # seconds a read may block; statements here take milliseconds
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    # No Hibernate session (and no pooled connection) held for the rest of the request after the service returns.
    open-in-view: false
    show-sql: false
    # No hibernate.dialect: Hibernate detects it from the connection (PostgreSQL
    # here, H2 under the test profile); setting it explicitly is deprecated.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    # The only Kafka key read: Boot's Kafka auto-configuration is not on the
    # classpath (plain spring-kafka), so producer and consumer settings live in
    # config/KafkaProducerConfig.java, which reads this through @Value.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  task:
    scheduling:
      # Two jobs: the outbox relay (every 500 ms) and ReservationExpiryJob, which calls product-service and
      # can wait on it. On Boot's single scheduler thread a slow expiry pass would hold back every event.
      pool:
        size: 2
      shutdown:
        # let a relay run that is mid-batch finish instead of interrupting it on SIGTERM
        await-termination: true
        await-termination-period: 20s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Fetch the registry every 5s (default 30s) so a replaced peer is seen
    # quickly. The LoadBalancer's own instance cache is shortened to match
    # (spring.cloud.loadbalancer.cache.ttl) where this service calls peers.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Heartbeat every 5s, expire after 15s (defaults 30s / 90s): a *crashed*
    # instance leaves the registry within ~20s instead of up to two minutes.
    # Graceful stops do not wait for this: the Kubernetes preStop hook marks
    # the instance OUT_OF_SERVICE through /actuator/serviceregistry and drains
    # for 15s, then Boot's graceful shutdown deregisters it — see
    # ecommerce-platform/k8s/40-services.yaml.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

resilience4j:
  circuitbreaker:
    instances:
      product-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        # A product-service that answers, but slowly, still holds a request thread per call for up to the read
        # timeout (10 s). Calls over 5 s count as slow, and when 80 % of the window is slow the breaker opens
        # and the rest fail fast instead of piling up behind it.
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
        # Without this the breaker leaves OPEN only when a call is attempted, so
        # an idle service stays tripped indefinitely.
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # A 4xx means the caller asked for something invalid; product-service is
        # healthy. Counting those as failures let a handful of requests for
        # unknown product ids trip the breaker and take out valid traffic too.
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - feign.FeignException$Conflict
          - feign.FeignException$UnprocessableEntity

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,serviceregistry
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Abandoned carts: ReservationExpiryJob cancels PENDING orders nobody has touched for pending-ttl and returns the
# stock they reserved. CONFIRMED orders are never expired (their payment may still be on its way).
orders:
  reservation:
    pending-ttl: PT24H
    expiry:
      enabled: true
      interval-ms: 600000
      initial-delay-ms: 60000
      batch-size: 100

# Transactional outbox (OutboxRelay): events are written with the state change and published from here.
# outbox.relay.enabled=false switches the relay off (the H2 test profile does: its native query is Postgres-only).
outbox:
  relay:
    enabled: true
    interval-ms: 500
    batch-size: 100

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    # DEBUG is a switch (LOGGING_LEVEL_COM_ECOMMERCE=DEBUG), not a default.
    com.ecommerce: INFO
    # Hibernate writes two WARN lines (SQLState, then the driver's message) for every failed JDBC call: with the
    # database down that is two lines per request, however busy the service is. The exception itself reaches
    # GlobalExceptionHandler, which logs one throttled line naming the cause.
    org.hibernate.orm.jdbc.error: "OFF"
    # When a database backend dies mid-transaction the rollback fails too, and Spring logs the application exception
    # it replaces ("Application exception overridden by rollback exception") with its whole stack trace: hundreds of
    # lines per request. GlobalExceptionHandler reports the outage once, throttled, with the cause.
    org.springframework.transaction.interceptor.TransactionInterceptor: "OFF"
    org.springframework.transaction.support.TransactionTemplate: "OFF"
