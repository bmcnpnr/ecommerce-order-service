spring:
  autoconfigure:
    exclude:
      - org.springframework.cloud.autoconfigure.LifecycleMvcEndpointAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# The relay's SELECT ... FOR UPDATE SKIP LOCKED is Postgres SQL; the *IT classes run the real relay.
outbox:
  relay:
    enabled: false

# The expiry job needs no scheduler in the H2 contexts; the *IT classes run it for real.
orders:
  reservation:
    expiry:
      enabled: false
